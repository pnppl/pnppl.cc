<p>
	<nav class="navbar mb-5" role="navigation" aria-label="main navigation">
		<div class="container px-3" dir="auto">
			<div id="navbarMenu" class="navbar-menu">
				<a class="icon-text navbar-item navbar-end navbar-brand" href="/" accesskey="h" aria-label="Home">
					<span class="icon is-small"><img alt="logo" src="/public/logo.gif" loading="lazy"></span>
					<span><u class="accel">H</u>ome</span>
				</a>
				{{- range $i, $a := links .page }}
				<li class="compat-hidden"></li>
				<a {{ range $k, $v := .Attrs }}{{$k}}="{{$v}}" {{end}}class="navbar-item icon-text">
					{{ with .Label -}}
					<span>{{.labelStart}}<u class="accel">{{.labelAccel}}</u>{{.labelEnd}}</span>
					{{- end }}
				</a>
				{{- end -}}
				{{ with .page }}
					{{ widgets "search" . }}
				{{- end -}}
				<li class="compat-hidden"></li>
				<a href="/+/feed.rss" class="navbar-item icon-text navbar-end" accesskey="f">
					<span id="RSS">RSS</span><span> <u class="accel">F</u>eed</span>
				</a>
			</div>
		</div>
	</nav>
</p>
